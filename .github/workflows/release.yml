name: Release

# PyPI's trusted publisher for haau3 names this file and the `pypi` environment, so neither is
# renamed. On every push to main, release-please (as haau3-bot) keeps one release PR open with the
# next version and its changelog, read from the titles of the squash-merged PRs (CONTRIBUTING.md).
# Merging that PR makes the GitHub Release and its tag, and this same run builds that version and
# waits in the `pypi` environment until a maintainer approves it, then publishes it with PEP 740
# attestations. No PyPI token exists anywhere: PyPI trusts this workflow through GitHub's OIDC token.
#
# The build and the publish are separate jobs, so no code of this repository or its dependencies
# runs while the OIDC token exists: the publish job only downloads the built files and hands them
# to PyPI's own action.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release PR and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint haau3-bot's token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HAAU3_BOT_CLIENT_ID }}
          private-key: ${{ secrets.HAAU3_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # release-please labels its PRs, and labels belong to issues.
          permission-issues: write
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The PR arrives as JSON text and is read in the script: GitHub evaluates a step's env before
      # its `if`, so fromJSON on the empty output of a run that opened no PR fails the job.
      - name: Request a review of the release PR
        if: steps.release.outputs.pr && vars.HAAU3_BOT_REVIEWER
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
          REVIEWER: ${{ vars.HAAU3_BOT_REVIEWER }}
        run: gh pr edit "$(jq -r .number <<< "$PR")" --repo "$GITHUB_REPOSITORY" --add-reviewer "$REVIEWER"

  build:
    name: Build the release
    needs: release
    # Not cancelled rather than succeeded: release-please makes the release before it updates PRs,
    # and a failure in that second pass must not leave a cut release unbuilt
    # (googleapis/release-please-action#1203).
    if: ${{ !cancelled() && needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: The tag names the package's version
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
        run: test "v$(python3 -I -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/haau3/_version.py").read()).group(1))')" = "$TAG"
      - name: The generated code matches the pinned spec
        run: uv run --no-sync python scripts/generate.py --check
      - run: uv run --no-sync pytest
      - run: uv build
      - run: uv run --no-sync python scripts/check_package.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish, with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
